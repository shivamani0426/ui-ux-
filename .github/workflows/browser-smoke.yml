name: Browser smoke test (Chromium + Firefox)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production app and build
        run: npm install --omit=dev
      - name: Install browser test runner
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Install browser binaries
        run: npx playwright install --with-deps chromium firefox
      - name: Verify frontend in real browsers
        run: NODE_ENV=test node tests/browser.e2e.mjs
      - name: Wait for exact GitHub commit on Render (no stale deploys)
        if: github.event_name == 'push'
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: node tests/live-release-smoke.mjs
      - name: Test live OpenRouter with disposable fictional guest (diagnostic release only)
        if: github.event_name == 'push' && (contains(github.event.head_commit.message, 'AI provider diagnostics') || contains(github.event.head_commit.message, 'Milestone 06 design intelligence'))
        env:
          AI_LIVE_CHECK: '1'
          AI_DESIGN_LIVE_CHECK: ${{ contains(github.event.head_commit.message, 'Milestone 06 design intelligence') && '1' || '0' }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: node tests/live-ai-smoke.mjs
      - name: Verify live Render site in real browsers
        if: github.event_name == 'push'
        env:
          TARGET_URL: https://ui-compass-studio.onrender.com
        run: NODE_ENV=test node tests/browser.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: browser-artifacts/
