name: Browser smoke test (Chromium + Firefox)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production app and build
        run: npm install --omit=dev
      - name: Verify reproducible 07D learning-quality fixtures
        run: npm run evaluate:learning
      - name: Verify official Kage original prompt live (non-blocking diagnostic for PR #53)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 53
        continue-on-error: true
        run: node tests/kage-public-diagnostic.mjs
      - name: Install browser test runner
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Install browser binaries
        run: npx playwright install chromium firefox
      - name: Verify React Bits original catalogue on PR 54 (non-blocking live diagnostic)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 54
        continue-on-error: true
        run: node tests/reactbits-live-smoke.mjs
      - name: Verify frontend in real browsers
        run: NODE_ENV=test node tests/browser.e2e.mjs
      - name: Verify simple public source-first chat and consent in Chromium and Firefox
        run: NODE_ENV=test node tests/simple-chat-browser.e2e.mjs
      - name: Verify exact publisher prompt viewer in Chromium and Firefox
        if: github.event_name == 'pull_request'
        run: NODE_ENV=test node tests/source-prompt-browser.e2e.mjs
      - name: Verify React Bits original component cards in Chromium and Firefox
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 54
        run: NODE_ENV=test node tests/reactbits-browser.e2e.mjs
      - name: Check real Aceternity component publisher API (diagnostic)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 55
        continue-on-error: true
        run: node tests/aceternity-live-smoke.mjs
      - name: Verify Aceternity UI links and saves in Chromium and Firefox
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 55
        run: NODE_ENV=test node tests/aceternity-browser.e2e.mjs
      - name: Wait for exact GitHub commit on Render (no stale deploys)
        id: release_gate
        if: github.event_name == 'push'
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: node tests/live-release-smoke.mjs
      - name: Test live OpenRouter with disposable fictional guest (diagnostic release only)
        if: github.event_name == 'push' && (contains(github.event.head_commit.message, 'AI provider diagnostics') || contains(github.event.head_commit.message, 'Milestone 06 design intelligence'))
        env:
          AI_LIVE_CHECK: '1'
          AI_DESIGN_LIVE_CHECK: ${{ contains(github.event.head_commit.message, 'Milestone 06 design intelligence') && '1' || '0' }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: node tests/live-ai-smoke.mjs
      - name: Verify latest feedback on live PostgreSQL with disposable guest (no AI calls)
        if: ${{ always() && github.event_name == 'push' && steps.release_gate.outcome == 'success' }}
        run: node tests/live-learning-smoke.mjs
      - name: Verify live Render site in real browsers
        # External-model outages must not prevent independent UI regression.
        # The job stays red if the model diagnostic failed; do NOT hide it.
        if: ${{ always() && github.event_name == 'push' && steps.release_gate.outcome == 'success' }}
        env:
          TARGET_URL: https://ui-compass-studio.onrender.com
        run: NODE_ENV=test node tests/browser.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: browser-artifacts/
