services:
  - type: web
    name: ui-compass
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ui-compass-postgres
          property: connectionString
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini

databases:
  - name: ui-compass-postgres
    databaseName: ui_compass
    user: ui_compass
    region: singapore
    plan: free
