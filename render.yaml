# Reuses the existing Render web service. Add a separate dedicated PostgreSQL
# instance and DATABASE_URL when capacity is available; do not reuse another app's DB.
services:
  - type: web
    name: ui-compass-studio
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Free-only candidate; never configure a paid model by default.
      - key: AI_PRIMARY_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: AI_FALLBACK_ENABLED
        value: "false"
      # Add GROQ_API_KEY securely in Render Environment during release.
      # Do not add the NVIDIA developer trial key to production.
