# Reuses the existing Render web service. Add a separate dedicated PostgreSQL
# instance and DATABASE_URL when capacity is available; do not reuse another app's DB.
services:
  - type: web
    name: ui-compass-studio
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
